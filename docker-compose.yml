version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    environment:
      - IR_SECRET_KEY=${IR_SECRET_KEY:-ir-platform-secret-key-2025-please-change-in-production}
      - IR_AI_ENCRYPTION_KEY=${IR_AI_ENCRYPTION_KEY:-QSLeoOZ1ZXDfBM0SrbJq1cBcRznji1L62SMCJae7nEo=}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backend_data:
